<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
  </head>
  <body>
    <form action="/register" method="post">
      <input type="text" placeholder="enter your FirstName" name="first_name" />
      <input type="text" placeholder="enter your LastName" name="last_name" />
      <input
        type="text"
        placeholder="enter your PhoneNumber"
        name="phone_number"
      />
      <input type="email" placeholder="enter your email" name="email" />
      <input type="text" placeholder="enter your gender" name="gender" />
      <input type="text" placeholder="enter your city" name="city" />
      <input
        type="text"
        placeholder="enter your Role student or admin"
        name="role"
      />
      <input
        type="password"
        placeholder="enter your password"
        name="password"
      />
      <button type="submit">submit</button>
    </form>
  </body>
</html>
